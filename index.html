<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="幸运转盘">
<meta name="theme-color" content="#FAFAFA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>幸运转盘</title>
<style>
:root{
  --bg:#FAFAFA;
  --paper:#FFFFFF;
  --ink:#1A1A1A;
  --sub:#8A8A8A;
  --accent:#1A1A1A;    /* 单色系主色(近黑) */
  --line:#E8E8E8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg); color:var(--ink); touch-action:manipulation;}
/* 转盘文字:微软雅黑(Windows)/苹方(iOS 回退) */
#wheelSvg text{font-family:'Microsoft YaHei','PingFang SC','Heiti SC',sans-serif;}

#app{max-width:480px;margin:0 auto;}
.page{display:none;flex-direction:column;min-height:100dvh;}
.page.active{display:flex;}

header.bar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 8px;}
header.bar h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.14em;}
header.bar .spacer{width:36px;}
.iconBtn{border:none;background:none;font-size:26px;color:var(--ink);padding:2px 6px;cursor:pointer;line-height:1;opacity:.75;}

main.wheel-page{flex:1;display:flex;flex-direction:column;
  padding:0 24px calc(env(safe-area-inset-bottom) + 18px);}

.wheel-wrap{position:relative;width:min(86vw,332px);aspect-ratio:1;margin:14px auto 4px;cursor:pointer;}
#wheelSvg{display:block;width:100%;height:100%;
  transition:transform 4s cubic-bezier(.12,.72,.24,1);}
.pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:24px solid var(--accent);z-index:2;}

#status{text-align:center;color:var(--sub);font-size:13px;letter-spacing:.05em;
  min-height:20px;margin:14px 0 16px;}
#spinBtn{border:1.5px solid var(--accent);border-radius:24px;background:var(--accent);color:#FFFFFF;
  font-size:16px;font-weight:600;letter-spacing:.3em;text-indent:.3em;
  padding:14px 0;width:100%;cursor:pointer;}
#spinBtn:active{opacity:.85;}
#spinBtn:disabled{background:transparent;color:var(--sub);border-color:var(--line);}

/* ---- 管理页 ---- */
#itemList{list-style:none;margin:0 18px;padding:0 4px;}
#itemList li{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:52px;
  background:var(--paper);border:1px solid var(--line);border-bottom:none;}
#itemList li:first-child{border-radius:16px 16px 0 0;}
#itemList li:last-child{border-bottom:1px solid var(--line);border-radius:0 0 16px 16px;}
#itemList li:first-child:last-child{border-radius:16px;border-bottom:1px solid var(--line);}
#itemList li.empty{justify-content:center;color:var(--sub);font-size:14px;}
.idx{font-size:11px;color:var(--sub);min-width:22px;text-align:right;}
.dot{width:13px;height:13px;border-radius:4px;flex:none;}
.name{flex:1;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ops{display:flex;gap:4px;flex:none;}
.ops button{border:none;background:none;color:var(--ink);border-radius:8px;
  font-size:13px;padding:6px 8px;cursor:pointer;min-width:32px;}
.ops button:disabled{opacity:.25;}
.ops button.danger{color:var(--accent);}
.editInput{flex:1;border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;
  font-size:15px;outline:none;min-width:0;background:var(--paper);color:var(--ink);}
.addRow{display:flex;gap:10px;margin:14px 20px 10px;}
.addRow input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:16px;outline:none;background:var(--paper);color:var(--ink);min-width:0;}
.addRow input:focus{border-color:var(--accent);}
.addRow button{border:1.5px solid var(--accent);border-radius:14px;background:var(--accent);color:#FFFFFF;
  font-size:15px;font-weight:600;padding:0 22px;cursor:pointer;}
.bulkBox{display:flex;flex-direction:column;gap:10px;margin:0 20px;}
.bulkBox textarea{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;
  outline:none;background:var(--paper);color:var(--ink);resize:none;width:100%;
  font-family:inherit;line-height:1.5;}
.bulkBox textarea:focus{border-color:var(--accent);}
.bulkRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hintInline{color:var(--sub);font-size:12px;}
#bulkBtn{border:1.5px solid var(--accent);border-radius:14px;background:transparent;color:var(--ink);
  font-size:14px;font-weight:600;padding:9px 18px;cursor:pointer;}
#bulkBtn:active{background:var(--accent);color:#FFFFFF;}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);
  transform:translateX(-50%) translateY(8px);background:var(--ink);color:#FFFFFF;font-size:13px;
  padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;
  letter-spacing:.05em;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hint{color:var(--sub);font-size:12px;text-align:center;margin:6px 20px 24px;letter-spacing:.03em;}

/* ---- 结果弹窗 ---- */
.overlay{position:fixed;inset:0;background:rgba(61,53,46,.38);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:28px;}
.overlay[hidden]{display:none;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;
  padding:30px 26px 24px;width:100%;max-width:330px;text-align:center;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.72);opacity:0;}}
.card .deco{width:26px;height:2px;background:var(--accent);margin:0 auto 12px;}
.card h2{margin:0 0 14px;font-size:12px;color:var(--sub);font-weight:500;
  letter-spacing:.35em;text-indent:.35em;}
.card .rname{font-size:32px;font-weight:700;margin:2px 0 24px;color:var(--accent);
  word-break:break-all;white-space:normal;line-height:1.35;}
.card .btns{display:flex;flex-direction:column;gap:10px;}
.card button{border-radius:22px;padding:13px;font-size:15.5px;font-weight:600;cursor:pointer;letter-spacing:.2em;text-indent:.2em;}
.card button:not(.primary){background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.card .primary{background:var(--accent);color:#FFFFFF;border:1.5px solid var(--accent);}
</style>
</head>
<body>
<div id="app">

  <!-- 主页面:转盘 -->
  <section id="pageWheel" class="page active">
    <header class="bar">
      <span class="spacer"></span>
      <h1>幸运转盘</h1>
      <button class="iconBtn" id="manageBtn" aria-label="选项管理">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>
    <main class="wheel-page">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer"></div>
        <svg id="wheelSvg" viewBox="-100 -100 200 200" aria-label="转盘"></svg>
      </div>
      <div id="status">点击转盘或下方按钮开始</div>
      <button id="spinBtn">开始抽取</button>
    </main>
  </section>

  <!-- 管理页面 -->
  <section id="pageManage" class="page">
    <header class="bar">
      <button class="iconBtn" id="backBtn" aria-label="返回">‹</button>
      <h1>选项管理</h1>
      <span class="spacer"></span>
    </header>
    <ul id="itemList"></ul>
    <div class="addRow">
      <input id="newName" placeholder="输入选项名称" maxlength="60">
      <button id="addBtn">添加</button>
    </div>
    <div class="bulkBox">
      <textarea id="bulkInput" rows="3" placeholder="批量添加:粘贴多项,用换行、逗号、顿号或分号分隔,也可手动输入后回车"></textarea>
      <div class="bulkRow">
        <span class="hintInline">已导入的项会追加到列表末尾</span>
        <button id="bulkBtn">批量导入</button>
      </div>
    </div>
    <p class="hint">↑↓ 调整顺序 · 从转盘正上方起顺时针排列 · 数据保存在本机</p>
  </section>

  <!-- 结果弹窗 -->
  <div id="resultOverlay" class="overlay" hidden>
    <div class="card">
      <div class="deco"></div>
      <h2>抽 中</h2>
      <p class="rname" id="resultName"></p>
      <div class="btns">
        <button class="primary" id="againBtn">再转一次</button>
        <button id="okBtn">好 的</button>
      </div>
    </div>
  </div>

</div>

  let c = (i % 2 === 0) ? '#FFFFFF' : '#ECECEC';
  if (n % 2 === 1 && i === n - 1) c = '#DBDBDB';

function uid(){
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

let items = loadItems();
let rotation = 0;
let spinning = false;
let lastResult = null;
let editingId = null;

function loadItems(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length) return arr;
    }
  }catch(e){}
  return ['火锅','烤肉','寿司','汉堡','沙拉','麻辣烫'].map(name => ({id: uid(), name}));
}
function saveItems(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(items)); }catch(e){}
}
function commit(){
  saveItems(); renderWheel(); renderList(); updateStatus(); updateSpinBtn();
}

/* ================= 工具 ================= */

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 字符显示宽度:中文/全角按 1,ASCII 按 0.55 */
function textWidth(s){
  let w = 0;
  for(const ch of s){
    w += ch.charCodeAt(0) > 0xFF ? 1 : 0.55;
  }
  return w;
}
/* 按显示宽度截断 */
function truncateWidth(s, maxW){
  let w = 0, out = '';
  for(const ch of s){
    const cw = ch.charCodeAt(0) > 0xFF ? 1 : 0.55;
    if(w + cw > maxW - 1) return out + '…';
    out += ch; w += cw;
  }
  return out;
}

/* 角度从正上方(0°)起顺时针 → SVG 坐标 */
function polar(deg, r){
  const rad = deg * Math.PI / 180;
  return {x: +(r * Math.sin(rad)).toFixed(3), y: +(-r * Math.cos(rad)).toFixed(3)};
}

/* ================= 转盘绘制 ================= */
/* 文字沿半径方向排布(唱片标签式),不会横跨相邻扇区;
   字号随名字长度自适应,放不下就截断,完整名称在结果弹窗展示。 */

function renderWheel(){
  const svg = document.getElementById('wheelSvg');
  const R = 87;        // 扇形外缘
  const RING = 93;     // 外装饰环
  const R0 = 34;       // 文字起始半径
  const R1 = 82;       // 文字最远半径
  const RADIAL = R1 - R0;

  if(!items.length){
    svg.innerHTML =
      `<circle r="${R}" fill="#F2F2F2"/>` +
      `<circle r="${RING}" fill="none" stroke="#1A1A1A" stroke-width="3"/>` +
      `<text y="-4" text-anchor="middle" font-size="12" fill="#8A8A8A">暂无选项</text>` +
      `<text y="14" text-anchor="middle" font-size="12" fill="#8A8A8A">点右上角添加</text>`;
    return;
  }

  const n = items.length;
  const sec = 360 / n;
  let html = '';

  /* 扇形 */
  if(n === 1){
    html += `<circle r="${R}" fill="#FFFFFF"/>`;
  } else {
    items.forEach((it, i) => {
      const a0 = i * sec, a1 = (i + 1) * sec;
      const p0 = polar(a0, R), p1 = polar(a1, R);
      const large = (a1 - a0) > 180 ? 1 : 0;
      html += `<path d="M0,0 L${p0.x},${p0.y} A${R},${R} 0 ${large} 1 ${p1.x},${p1.y} Z"` +
              ` fill="${shade(i, n)}"/>`;
    });
  }

  /* 文字(径向排布,左右两半各自朝可读方向) */
  items.forEach((it, i) => {
    const mid = (n === 1) ? 90 : i * sec + sec / 2;
    /* 字号:受扇区弧宽(0.62R 处)与名字长度双重约束;
       长名字先缩小字号,缩到下限放不下才截断 */
    const arcLen = 2 * Math.PI * 0.62 * R * sec / 360;
    const needW = textWidth(it.name);
    let fs = Math.min(arcLen * 0.78, RADIAL / (needW + 0.5), 12);
    fs = Math.max(fs, 6.5);
    const maxW = RADIAL / fs;
    const label = truncateWidth(it.name, maxW);
    const leftSide = mid > 180;

    let t;
    if(leftSide){
      /* 左半:从外缘向圆心排,正立可读 */
      t = `rotate(${(mid + 90).toFixed(2)}) translate(${(-R1).toFixed(1)} 0)`;
    } else {
      /* 右半:从圆心向外排 */
      t = `rotate(${(mid - 90).toFixed(2)}) translate(${R0.toFixed(1)} 0)`;
    }
    html += `<text transform="${t}" text-anchor="start" dominant-baseline="middle"` +
            ` font-size="${fs.toFixed(1)}" font-weight="500" fill="#333333">` +
            `${escapeHtml(label)}</text>`;
  });

  /* 中心圆钮(用户提供的简笔画小狗,已抠背景)+ 外粗描边环 */
  html += `<circle r="${RING}" fill="none" stroke="#1A1A1A" stroke-width="3"/>` +
          `<circle r="15" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>` +
          `<image href="${DOG_IMG}" x="-11" y="-9.2" width="22" height="18.3"/>`;
  svg.innerHTML = html;
}

/* ================= 抽取 ================= */

function spin(){
  if(spinning || !items.length) return;
  spinning = true;
  lastResult = null;
  hideResult();
  updateStatus(); updateSpinBtn();

  const n = items.length;
  const sec = 360 / n;
  const index = Math.floor(Math.random() * n);
  const jitter = (Math.random() * 0.7 - 0.35) * sec;
  const theta = index * sec + sec / 2 + jitter;

  const turns = 6 + Math.floor(Math.random() * 4);
  const currentMod = ((rotation % 360) + 360) % 360;
  const target = (((-theta) % 360) + 360) % 360;
  const delta = ((target - currentMod) % 360 + 360) % 360;

  rotation += turns * 360 + delta;
  document.getElementById('wheelSvg').style.transform = `rotate(${rotation}deg)`;

  setTimeout(() => {
    spinning = false;
    lastResult = items[index];
    showResult(lastResult);
    updateStatus(); updateSpinBtn();
  }, SPIN_MS + 150);
}

/* ================= 状态 / 弹窗 ================= */

function updateStatus(){
  const el = document.getElementById('status');
  if(spinning) el.textContent = '转动中…';
  else if(lastResult) el.textContent = `上次结果:${lastResult.name}`;
  else if(!items.length) el.textContent = '还没有选项,点右上角添加';
  else el.textContent = '点击转盘或下方按钮开始';
}
function updateSpinBtn(){
  const b = document.getElementById('spinBtn');
  b.disabled = spinning || !items.length;
  b.textContent = spinning ? '转动中' : '开始抽取';
}

function showResult(item){
  const el = document.getElementById('resultName');
  el.textContent = item.name;                     /* 完整显示,不截断 */
  const w = textWidth(item.name);
  el.style.fontSize = (w <= 6 ? '32px' : w <= 12 ? '26px' : w <= 20 ? '21px' : '17px');
  document.getElementById('resultOverlay').hidden = false;
}
function hideResult(){
  document.getElementById('resultOverlay').hidden = true;
}

/* ================= 选项管理 ================= */

function renderList(){
  const ul = document.getElementById('itemList');
  if(!items.length){
    ul.innerHTML = '<li class="empty">暂无选项,在下方添加</li>';
    return;
  }
  ul.innerHTML = items.map((it, i) => {
    const idx = String(i + 1).padStart(2, '0');
    if(editingId === it.id){
      return `<li data-id="${it.id}">` +
        `<input class="editInput" value="${escapeHtml(it.name)}" maxlength="60">` +
        `<span class="ops"><button data-act="save">完成</button>` +
        `<button data-act="cancel" class="danger">取消</button></span></li>`;
    }
    return `<li data-id="${it.id}">` +
      `<span class="idx">${idx}</span>` +
      `<span class="name">${escapeHtml(it.name)}</span>` +
      `<span class="ops">` +
        `<button data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>` +
        `<button data-act="down" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>` +
        `<button data-act="edit">编辑</button>` +
        `<button data-act="del" class="danger">删除</button>` +
      `</span></li>`;
  }).join('');

  const input = ul.querySelector('.editInput');
  if(input){
    input.focus();
    input.select();
  }
}

/* ================= 事件绑定 ================= */

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
}

document.getElementById('wheelWrap').addEventListener('click', spin);
document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('againBtn').addEventListener('click', () => { hideResult(); spin(); });
document.getElementById('okBtn').addEventListener('click', hideResult);
document.getElementById('resultOverlay').addEventListener('click', e => {
  if(e.target.id === 'resultOverlay') hideResult();
});

document.getElementById('manageBtn').addEventListener('click', () => {
  editingId = null;
  renderList();
  showPage('pageManage');
});
document.getElementById('backBtn').addEventListener('click', () => showPage('pageWheel'));

document.getElementById('addBtn').addEventListener('click', () => {
  const input = document.getElementById('newName');
  const name = input.value.trim();
  if(!name) return;
  items.push({id: uid(), name});
  input.value = '';
  commit();
  document.getElementById('newName').focus();
});
document.getElementById('newName').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('addBtn').click();
});

/* 批量导入:换行 / 中英文逗号 / 顿号 / 中英文分号分隔 */
document.getElementById('bulkBtn').addEventListener('click', () => {
  const ta = document.getElementById('bulkInput');
  const parts = ta.value.split(/[\n\r,，、;；]+/)
    .map(s => s.trim()).filter(Boolean);
  if(!parts.length) return;
  parts.forEach(name => items.push({id: uid(), name}));
  ta.value = '';
  commit();
  showToast(`已导入 ${parts.length} 项`);
});
document.getElementById('bulkInput').addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter') document.getElementById('bulkBtn').click();
});

let toastTimer = null;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

document.getElementById('itemList').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const li = btn.closest('li');
  if(!li || !li.dataset.id) return;
  const id = li.dataset.id;
  const i = items.findIndex(x => x.id === id);
  if(i < 0) return;

  switch(btn.dataset.act){
    case 'del':
      items.splice(i, 1);
      commit();
      break;
    case 'up':
      if(i > 0){ [items[i-1], items[i]] = [items[i], items[i-1]]; commit(); }
      break;
    case 'down':
      if(i < items.length - 1){ [items[i], items[i+1]] = [items[i+1], items[i]]; commit(); }
      break;
    case 'edit':
      editingId = id;
      renderList();
      break;
    case 'save': {
      const v = li.querySelector('.editInput').value.trim();
      if(v){ items[i].name = v; editingId = null; commit(); }
      break;
    }
    case 'cancel':
      editingId = null;
      renderList();
      break;
  }
});

/* ================= Service Worker(仅线上 https,本地调试不缓存) ================= */

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ================= 初始化 ================= */

renderWheel();
renderList();
updateStatus();
updateSpinBtn();
</script>
</body>
</html>
